[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77: PEP 639 SPDX `license` string
build-backend = "setuptools.build_meta"

[project]
name = "llm-surgeon"
version = "0.1.0"
description = "Surgical layer-level manipulation and interpretability probing of local LLaMA models"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Michael Lannum" }]
dependencies = [
    "torch>=2.0",
    "transformers>=5.0",
    "accelerate>=0.27",
    "huggingface_hub>=0.20",
    "safetensors",
    "tokenizers",
    "numpy>=1.24",
    "requests",
    "pyyaml>=6.0",
    "sentencepiece>=0.1.99",
    # calibrate() / perplexity(dataset=...) load wikitext-2 by default.
    "datasets>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyright",
    "scipy",  # rank-correlation checks in the real-model probe tests
]
# nf4 / int8 load_model modes (bitsandbytes; CUDA-oriented wheels).
quant = [
    "bitsandbytes>=0.43",
]
# lm-eval harness benchmarks in `benchmark`.
eval = [
    "lm_eval>=0.4",
]
# Writing GGUF files (gguf_writer.export_hf_to_gguf).
gguf = [
    "gguf>=0.10",
]
# Native LlamaEngine GGUF inference via llama.cpp bindings.
llama = [
    "llama-cpp-python>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_surgeon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swig:DeprecationWarning",
]

